name: Update FMA Events

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install icalendar recurring-ical-events

      - name: Read Outlook calendar
        env:
          FMA_OUTLOOK_ICS_URL: ${{ secrets.FMA_OUTLOOK_ICS_URL }}
        run: python scripts/update_events.py

      - name: Commit updated events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/upcoming-events.json

          if git diff --cached --quiet; then
            echo "No event changes detected."
          else
            git commit -m "Update upcoming FMA events"
            git push
          fi